name: Wording sweep

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/wording_sweep.py"
      - ".github/workflows/wording-sweep.yml"

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[sweep-bot]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/wording_sweep.py
      - run: |
          set -euo pipefail
          git config user.name "MD Nexa Bot"
          git config user.email "mdnexa9@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "Describe the studio as a software studio on every page [sweep-bot]"
          git push
