# Rebuilds the studio pages from the design system in site_kit.py
name: Build the studio site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/site_kit.py"
      - ".github/scripts/site_pages.py"
      - ".github/scripts/site_home.py"
      - ".github/workflows/site-build.yml"

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/site_home.py
      - run: python .github/scripts/site_pages.py
      - run: |
          set -euo pipefail
          git config user.name "MD Nexa Bot"
          git config user.email "mdnexa9@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "Rebuild the studio pages [build-bot]"
          git push
