name: Build language pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/site_langs.py"
      - ".github/workflows/site-langs.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[lang-bot]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/site_langs.py
      - run: |
          set -euo pipefail
          git config user.name "MD Nexa Bot"
          git config user.email "mdnexa9@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "Add French, Spanish and German pages and link them [lang-bot]"
          git push
