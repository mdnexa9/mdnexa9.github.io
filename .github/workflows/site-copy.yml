name: Apply site copy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/site_copy.py"
      - ".github/workflows/site-copy.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[copy-bot]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/site_copy.py
      - run: |
          set -euo pipefail
          git config user.name "MD Nexa Bot"
          git config user.email "mdnexa9@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "Apply studio wording, About section and Play screens [copy-bot]"
          git push
