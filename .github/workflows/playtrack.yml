name: Add Play click tracking
on:
  push:
    paths:
      - '.github/workflows/playtrack.yml'
permissions:
  contents: write
jobs:
  add-tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Play click tracker before body end
        run: |
          python3 - <<'PY'
          import pathlib, re
          SNIPPET = '''<script>
          (function () {
            document.addEventListener('click', function (e) {
              var t = e.target;
              if (!t || !t.closest) return;
              var a = t.closest('a[href*="play.google.com"]');
              if (!a) return;
              var m = a.href.match(/id=([A-Za-z0-9_.]+)/);
              if (typeof gtag === 'function') {
                gtag('event', 'play_click', {
                  link_url: a.href,
                  app_id: m ? m[1] : '',
                  page_path: location.pathname
                });
              }
            }, true);
          })();
          </script>
          '''
          changed = []
          for p in sorted(pathlib.Path('.').rglob('*.html')):
              if '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              if 'play_click' in s:
                  continue
              m = re.search(r'</body>', s, re.I)
              if m:
                  s = s[:m.start()] + SNIPPET + s[m.start():]
              else:
                  s = s + SNIPPET
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))
          print('changed:', changed)
          PY
      - name: Commit and push
        run: |
          git config user.name "MD Nexa"
          git config user.email "mdnexa9@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Track Google Play button clicks as play_click events"
          git push
