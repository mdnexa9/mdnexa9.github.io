name: Cards fix 7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/cards_fix7.py"
      - ".github/workflows/cards-fix7.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[cards7-bot]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/cards_fix7.py
      - run: |
          set -euo pipefail
          git config user.name "MD Nexa Bot"
          git config user.email "mdnexa9@gmail.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "Centre the Darkflow placeholder [cards7-bot]"
          git push
