name: Wire game links into the site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/wire_games.py"
      - ".github/workflows/wire-games.yml"

permissions:
  contents: write

concurrency:
  group: wire-games
  cancel-in-progress: true

jobs:
  wire:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[wire-bot]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch pages
        run: python3 .github/scripts/wire_games.py

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "MD Nexa Bot"
          git config user.email "mdnexa9@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Show MD Darkflow and MD Bolt Master on the home page and articles hub [wire-bot]"
          git push
